[project]
name = "playout"
version = "2.0.1"
description = "Frikanalen playout system for CasparCG integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytz>=2025.2",
    "loguru>=0.7.0",
    # Runtime dependencies of the generated frikanalen_django_api_client
    # package, which ships as vendored source without its own metadata.
    "httpx>=0.23.0,<0.29.0",
    "attrs>=22.2.0",
]

[project.scripts]
playout = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["playout_lib", "frikanalen_django_api_client"]
# The generated client is gitignored, and hatchling's file selection defaults to
# honouring VCS ignore rules, which silently drops it from the wheel. Listing it
# as an artifact includes it regardless.
artifacts = ["frikanalen_django_api_client/**"]

[dependency-groups]
dev = [
    "openapi-python-client>=0.28.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

name: Playout build

on:
  push:
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write
  contents: write
  packages: write  # Needed to push to ghcr.io

jobs:
  build:
    name: Build and push Docker image to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Release PR or GitHub Release (main only)
        id: release
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: googleapis/release-please-action@v5
        with:
          # No release-type here on purpose: passing it puts the action in
          # single-package mode, where release-please-config.json is never read
          # and its extra-files (chart/Chart.yaml) are silently ignored.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Generate API client
        run: ./generate-client.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/frikanalen/playout
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=raw,value=${{ steps.release.outputs.tag_name }},enable=${{ github.ref == 'refs/heads/main' && steps.release.outputs.release_created == 'true' }}
            type=sha

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
